<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coral Wiki</title>
    <meta name="description" content="Wiki hors ligne de Coral Island : cultures, poissons, PNJ, temple, musée, trackers." />
    <meta name="theme-color" content="#f2f2f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coral Wiki" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://static.wikia.nocookie.net" crossorigin />
    <script>
      // Thème appliqué avant le rendu (évite le flash).
      try {
        // Par défaut « Auto (soir) » : sombre de 19 h à 7 h, sinon comme le système
        var t = localStorage.getItem('cw-theme') || 'soir';
        var h = new Date().getHours();
        if (t === 'soir') t = h >= 19 || h < 7 ? 'dark' : '';
        if (t === 'light' || t === 'dark' || t === 'oled') document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Lien direct vers une fiche (?f=<id> ou #/fiche/<id>) : son fichier part dès maintenant
      try {
        var m = /[?&]f=([a-z0-9-]+)/.exec(location.hash) || /^#\/fiche\/([a-z0-9-]+)/.exec(location.hash);
        if (m) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'fetch';
          l.crossOrigin = 'anonymous';
          l.href = 'e/' + m[1] + '.json';
          document.head.appendChild(l);
        }
      } catch (e) {}
    </script>
      <!-- Police des grands titres (OFL) : préchargée, elle arrive avec le JS au lieu d'après lui -->
    <link rel="preload" href="/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Fredoka';
        src: url('fonts/fredoka.woff2') format('woff2'); /* relatif à la base du site */
        font-weight: 300 700;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Coral Wiki nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
