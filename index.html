<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coral Wiki</title>
    <meta name="description" content="Wiki hors ligne de Coral Island : cultures, poissons, PNJ, temple, musée, trackers." />
    <meta name="theme-color" content="#0b5f63" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#081a20" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coral Wiki" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://static.wikia.nocookie.net" crossorigin />
    <script>
      // Thème appliqué avant le rendu (évite le flash).
      try {
        var t = localStorage.getItem('cw-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Coral Wiki nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
